<!DOCTYPE html>
<html lang="ja">
<head>

<title>きらめき！アイドルプロジェクト</title>
<style>
:root{--pink:#ff5db1;--hot:#ff3d9a;--purple:#8b68ef;--blue:#65b9ff;--gold:#ffd56a;--ink:#46365f;--muted:#8b7d9f;--paper:#fffaff;--line:#f1d9f0}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 10% 0%,#ffe2f2 0,transparent 32%),radial-gradient(circle at 100% 15%,#dfe8ff 0,transparent 30%),#f9f5ff;color:var(--ink);font-family:system-ui,-apple-system,"Hiragino Kaku Gothic ProN","Meiryo",sans-serif}
button{font:inherit;border:0;cursor:pointer;transition:.18s transform,.18s filter}button:hover{filter:brightness(1.04);transform:translateY(-1px)}button:disabled{opacity:.45;cursor:not-allowed;transform:none}
.app{max-width:1240px;margin:auto;padding:16px}.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;background:#ffffffd9;backdrop-filter:blur(12px);border:1px solid white;border-radius:22px;padding:12px 16px;box-shadow:0 8px 30px #d7a6df38;position:sticky;top:8px;z-index:5}
.brand{font-weight:1000;font-size:clamp(17px,3vw,25px);letter-spacing:-.04em;color:#ed4ba5}.brand span{color:#8e6ee9}.resources{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}.pill{border-radius:999px;padding:8px 12px;background:#fff0fa;font-size:13px;font-weight:800;white-space:nowrap}.pill b{color:#e847a0}.layout{display:grid;grid-template-columns:220px 1fr;gap:16px;margin-top:16px}.sidebar{background:#ffffffc9;border:1px solid white;border-radius:24px;padding:12px;height:max-content;box-shadow:0 8px 24px #d7a6df25}.nav{display:flex;flex-direction:column;gap:7px}.nav button{padding:13px 14px;text-align:left;border-radius:15px;background:transparent;color:#776588;font-weight:850}.nav button.active{background:linear-gradient(100deg,#ff8bc9,#a78bff);color:white;box-shadow:0 6px 15px #dd8ce766}.main{min-width:0}.panel{background:#ffffffdb;border:1px solid #fff;border-radius:26px;padding:clamp(14px,2.5vw,25px);box-shadow:0 12px 35px #b99cd52a;margin-bottom:16px}.hero{position:relative;overflow:hidden;min-height:300px;background:linear-gradient(120deg,#ffb9dd,#d6c5ff 57%,#b6e4ff);border-radius:23px;padding:24px;display:grid;grid-template-columns:1.2fr .8fr;align-items:center;gap:12px}.hero:before,.hero:after{content:"✦";position:absolute;color:#fff8;font-size:100px;right:15%;top:0;animation:float 4s ease-in-out infinite}.hero:after{content:"♡";font-size:70px;right:6%;top:auto;bottom:5%;animation-delay:-2s}.eyebrow{font-size:12px;letter-spacing:.12em;font-weight:900;color:#8d4e9c}.hero h1{font-size:clamp(27px,4vw,46px);line-height:1.12;margin:8px 0;color:#fff;text-shadow:0 3px 0 #e779bd,0 7px 18px #a35ca6aa}.hero p{font-weight:700;color:#704c88;max-width:460px}.hero-actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:18px}.btn{border-radius:14px;padding:12px 17px;font-weight:900;box-shadow:0 5px 0 #00000012}.primary{background:linear-gradient(110deg,#ff65b4,#ff8cc9);color:white}.purple{background:linear-gradient(110deg,#8f6af0,#b49bff);color:white}.blue{background:linear-gradient(110deg,#55aaff,#8dd8ff);color:white}.gold{background:linear-gradient(110deg,#ffcc59,#ffe99b);color:#76521b}.soft{background:#fff0fa;color:#a34e91;border:1px solid #ffd2ed}.hero-idol{position:relative;z-index:1;display:flex;justify-content:center;align-items:center;min-height:230px}.idol-art{width:min(230px,100%);aspect-ratio:4/5;border:4px solid #fff;border-radius:48% 48% 28px 28px;background:linear-gradient(150deg,#fff7fc,#ffb9dd 45%,#b5a4ff);box-shadow:0 12px 30px #9d5ca655;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;overflow:hidden}.idol-art:before{content:"";position:absolute;width:150px;height:180px;background:#fff6;border-radius:50%;top:-60px;left:-20px}.face{font-size:85px;filter:drop-shadow(0 4px 0 #ffffff70);z-index:1}.costume{font-size:50px;z-index:1;margin-top:-4px}.name-tag{z-index:1;background:#ffffffdc;border-radius:999px;padding:5px 12px;font-size:12px;font-weight:900;margin-top:8px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:14px}.stat{background:#fff;border:1px solid #f6e4f5;border-radius:17px;padding:12px}.stat small{display:block;color:var(--muted);font-weight:800}.stat strong{font-size:22px;color:#e94d9f}.section-title{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 14px}.section-title h2{margin:0;font-size:21px}.section-title small{color:var(--muted);font-weight:700}.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:12px}.card{border:2px solid white;border-radius:18px;overflow:hidden;background:#fff;box-shadow:0 6px 18px #b99cd526;position:relative}.card-art{min-height:150px;display:flex;align-items:center;justify-content:center;flex-direction:column;position:relative;overflow:hidden;background:linear-gradient(145deg,#ffe1f2,#d8caff)}.card-art:before{content:"✦  ·  ✧  ·  ♡";position:absolute;top:8px;color:#fff;font-size:20px;text-shadow:0 1px 5px #b778d8}.card-art .face{font-size:67px}.card-art .costume{font-size:35px}.rarity{position:absolute;top:8px;left:8px;border-radius:8px;padding:4px 7px;color:#fff;font-weight:1000;font-size:12px;z-index:1;text-shadow:0 1px 3px #0002}.SSR{background:linear-gradient(100deg,#ffb82e,#ffdf75);color:#744600}.SR{background:linear-gradient(100deg,#a477f3,#d0a7ff)}.R{background:linear-gradient(100deg,#56a7ff,#8de2ff)}.N{background:linear-gradient(100deg,#99a4b8,#c9d0dc)}.card-info{padding:10px}.card-info strong{display:block;font-size:14px}.card-info small{color:var(--muted);font-size:11px}.mini-stats{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}.mini-stats span{font-size:10px;background:#fff0fa;border-radius:6px;padding:3px 5px;font-weight:800}.card-actions{display:flex;gap:5px;padding:0 9px 10px}.card-actions button{font-size:11px;padding:7px 8px;border-radius:9px;flex:1;font-weight:850}.bar{height:8px;border-radius:99px;background:#eee6f6;overflow:hidden}.bar span{height:100%;display:block;background:linear-gradient(90deg,#ff68b6,#9a7aff);border-radius:99px}.tabs{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px}.tabs button{border-radius:99px;background:#f7ecff;color:#8b6aa1;padding:8px 13px;font-weight:850}.tabs button.active{background:#956bf0;color:white}.gacha-stage{min-height:260px;border-radius:22px;background:radial-gradient(circle,#fff 0,#f6dfff 30%,#b8a2ff 72%,#6e5dc4);display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center;color:#fff;position:relative;overflow:hidden}.gacha-stage:before{content:"✦ ✧ ✦ ♡ ✧ ✦";font-size:34px;position:absolute;animation:float 4s ease-in-out infinite;opacity:.65}.ticket{font-size:85px;filter:drop-shadow(0 0 20px #fff);z-index:1}.gacha-stage h2{z-index:1;text-shadow:0 2px 8px #7852c7;margin:0}.gacha-stage p{z-index:1;font-weight:800;text-shadow:0 1px 5px #7852c7}.result-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;margin-top:14px}.result{animation:pop .4s both}.form-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.slot{min-height:150px;border:2px dashed #e6c6ed;border-radius:16px;display:flex;align-items:center;justify-content:center;flex-direction:column;background:#fff8fe;padding:7px;text-align:center;cursor:pointer}.slot.filled{border-style:solid;background:#fff}.slot .face{font-size:40px}.slot small{font-size:11px;font-weight:800}.notice{padding:12px 14px;background:#fff4cf;border:1px solid #ffe69a;border-radius:13px;color:#7d6124;font-size:13px;font-weight:750;margin:10px 0}.empty{text-align:center;padding:35px;color:var(--muted);font-weight:750}.modal-backdrop{position:fixed;inset:0;background:#3020449c;display:none;align-items:center;justify-content:center;padding:18px;z-index:20;backdrop-filter:blur(7px)}.modal-backdrop.show{display:flex}.modal{width:min(650px,100%);max-height:90vh;overflow:auto;background:#fffaff;border:2px solid white;border-radius:24px;padding:20px;box-shadow:0 25px 80px #25123966;animation:pop .25s}.modal-head{display:flex;justify-content:space-between;align-items:center;gap:10px}.close{background:#f4e7fa;border-radius:50%;width:36px;height:36px;font-size:20px}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#46365f;color:#fff;padding:12px 18px;border-radius:999px;box-shadow:0 8px 30px #0003;z-index:40;display:none;font-weight:850}.toast.show{display:block;animation:pop .2s}.shine{animation:shine 1.5s ease-in-out infinite}.hidden{display:none!important}.footer{color:#9c8eaa;text-align:center;font-size:12px;padding:18px}
@keyframes float{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-12px) rotate(8deg)}}@keyframes pop{from{transform:scale(.78);opacity:0}to{transform:scale(1);opacity:1}}@keyframes shine{0%,100%{filter:brightness(1)}50%{filter:brightness(1.35) drop-shadow(0 0 12px #fff)}}@keyframes flash{0%{opacity:0}30%{opacity:1}100%{opacity:0}}
@media(max-width:780px){.layout{grid-template-columns:1fr}.sidebar{position:sticky;top:75px;z-index:4;padding:7px;overflow:auto}.nav{flex-direction:row;min-width:max-content}.nav button{padding:10px 12px}.hero{grid-template-columns:1fr;min-height:0}.hero-idol{min-height:180px}.idol-art{width:155px}.face{font-size:65px}.costume{font-size:35px}.stats{grid-template-columns:repeat(2,1fr)}.form-grid{grid-template-columns:repeat(3,1fr)}.topbar{align-items:flex-start;flex-direction:column}.resources{justify-content:flex-start}.cards{grid-template-columns:repeat(auto-fill,minmax(135px,1fr))}}
</style>
</head>
<body>
<div class="app">
<header class="topbar">
  <div class="brand">きらめき！<span>IDOL PROJECT</span> ♡</div>
  <div class="resources">
    <div class="pill">⚡ スタミナ <b id="staminaTop">100/100</b></div>
    <div class="pill">🎟 チケット <b id="ticketTop">1/30</b></div>
    <div class="pill">⏳ 次の回復 <b id="timerTop">--:--</b></div>
  </div>
</header>
<div class="layout">
<aside class="sidebar"><nav class="nav" id="nav">
<button class="active" data-page="home">🏠 ホーム</button><button data-page="gacha">🎟 ガチャ</button><button data-page="cards">💖 所持カード</button><button data-page="training">✨ レッスン</button><button data-page="awakening">🌟 覚醒</button><button data-page="formation">🎤 編成</button><button data-page="encyclopedia">📚 図鑑</button><button data-page="settings">💾 セーブ</button>
</nav></aside>
<main class="main" id="main"></main>
</div>
<div class="footer">きらめき！IDOL PROJECT · 個人用プロトタイプ · データはこのブラウザに保存されます</div>
</div>
<div class="modal-backdrop" id="modalBackdrop"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>
<script>
const RARITIES={SSR:{max:65,rate:5},SR:{max:55,rate:15},R:{max:45,rate:30},N:{max:35,rate:50}};
const outfits={SSR:['かわいい水着'],SR:['アイドル衣装'],R:['夏私服','冬私服'],N:['学校制服','練習ジャージ']};
const hair=['黒髪ロング','ミルクティーブラウン','桜ピンク','ラベンダー','アクアブルー','ハニーブロンド','銀髪','赤茶','ミントグリーン','紺色','コーラル','藤色','白銀ツイン','チョコブラウン','オレンジ','青紫','ローズピンク','アッシュグレー','ターコイズ','ダークネイビー'];
const names=['桃瀬 ひまり','白石 るな','星野 みお','天音 りり','桜庭 こはる','月城 しずく','水瀬 あおい','花咲 めい','小鳥遊 ゆあ','藤宮 すみれ','七瀬 ここな','一ノ瀬 りお','柊木 ましろ','早乙女 えま','朝比奈 のあ','神楽坂 せな','姫宮 いちか','橘 さくら','雨宮 みな','風間 りん','春野 つむぎ','相沢 かれん','綾瀬 みく','久遠 かなで','結城 ほのか','有栖川 まり','小坂 ひなた','西園寺 れい','黒崎 るり','瀬戸 こゆき','水城 さら','高峰 あかり','白鳥 ゆき','成瀬 まな','三日月 こころ','望月 ちあき','花村 すず','桐谷 りんね','鳴海 みれい','御影 ありす'];
const vibes=['元気で前向き','おっとり癒やし系','クールで努力家','小悪魔で甘え上手','真面目な優等生','自由奔放','天然でマイペース','負けず嫌い','お姉さん気質','人見知りだけど情熱的'];
const emojis=['🎀','🌙','⭐','🫧','🌸','🦋','💎','🍓','🐰','💜','🍒','🪽','❄️','🍰','🍊','🌌','💗','🩵','🌷','🎧'];
const colors=[['#ffd0e9','#c6b6ff'],['#c6e8ff','#e6d1ff'],['#ffdbcc','#ffc2e4'],['#d4ccff','#ffcae8'],['#d0f5ed','#b9d6ff'],['#fff0bd','#ffc9df']];
const cast=names.map((name,i)=>({id:i,name,hair:hair[i%hair.length],vibe:vibes[i%vibes.length],emoji:emojis[i%emojis.length],colors:colors[i%colors.length],profile:`${vibes[i%vibes.length]}。${hair[i%hair.length]}がトレードマーク。`,}));
let state;
function fresh(){return {version:1,tickets:1,ticketAnchor:Date.now(),stamina:100,staminaAnchor:Date.now(),inventory:[],dex:{},formation:Array(5).fill(null),activePage:'home',nextId:1,firstMaxSeen:{}}}
function load(){try{const s=JSON.parse(localStorage.getItem('kiramekiSave'));if(s&&s.version===1)return {...fresh(),...s}}catch(e){}return fresh()}
state=load();
function save(){localStorage.setItem('kiramekiSave',JSON.stringify(state));}
function syncTimers(){let now=Date.now();if(state.tickets<30){let n=Math.floor((now-state.ticketAnchor)/3600000);if(n>0){state.tickets=Math.min(30,state.tickets+n);state.ticketAnchor+=n*3600000;if(state.tickets>=30)state.ticketAnchor=now;}}else state.ticketAnchor=now;
let sn=Math.floor((now-state.staminaAnchor)/180000);if(sn>0){state.stamina=Math.min(100,state.stamina+sn);state.staminaAnchor+=sn*180000;if(state.stamina>=100)state.staminaAnchor=now;}else if(state.stamina>=100)state.staminaAnchor=now;save();}
function timeLeft(anchor,interval,full){if(full)return '満タン';let left=Math.max(0,interval-(Date.now()-anchor)%interval);return `${String(Math.floor(left/60000)).padStart(2,'0')}:${String(Math.floor(left/1000)%60).padStart(2,'0')}`}
function ticketTimer(){return state.tickets>=30?'満タン':timeLeft(state.ticketAnchor,3600000,false)}
function staminaTimer(){return state.stamina>=100?'満タン':timeLeft(state.staminaAnchor,180000,false)}
function updateHeader(){syncTimers();document.getElementById('staminaTop').textContent=`${state.stamina}/100`;document.getElementById('ticketTop').textContent=`${state.tickets}/30`;document.getElementById('timerTop').textContent=`🎟 ${ticketTimer()} · ⚡ ${staminaTimer()}`;}
function cardDef(key){let [cid,rarity,variant]=key.split('|');let c=cast[+cid];return {key,cid:+cid,rarity,variant:+variant,char:c,outfit:outfits[rarity][+variant]}}
function cardStats(def){let rbase={SSR:23,SR:18,R:13,N:8}[def.rarity];let v=def.variant;let seed=(def.cid*7+v*11+def.rarity.length*3)%17;return {looks:Math.min(100,rbase+seed+(def.rarity==='SSR'?8:0)),style:Math.min(100,rbase+((seed*3)%19)),dance:Math.min(100,rbase+((seed*5+4)%20)),vocal:Math.min(100,rbase+((seed*7+2)%20))}}
function allDefs(){let a=[];cast.forEach(c=>Object.keys(outfits).forEach(r=>outfits[r].forEach((o,v)=>a.push(cardDef(`${c.id}|${r}|${v}`)))));return a}
function ownedCount(key){return state.inventory.filter(x=>x.key===key).length}
function getInst(id){return state.inventory.find(x=>x.uid===id)}
function defOf(inst){return cardDef(inst.key)}
function maxLevel(inst){return RARITIES[inst.rarity].max+inst.awake*2}
function shown(n){return Math.floor(n+1e-8)}
function statsOf(inst){let base=inst.baseStats;let growth=(inst.level-1)*.5;return Object.fromEntries(Object.entries(base).map(([k,v])=>[k,Math.min(100,v+growth)]))}
function totalStats(inst){return Object.values(statsOf(inst)).reduce((a,b)=>a+b,0)}
function xpNeed(level){return 50+10*(level-1)}
function cardInstance(key){let d=cardDef(key);let base=cardStats(d);return {uid:state.nextId++,key,cid:d.cid,rarity:d.rarity,variant:d.variant,level:1,xp:0,awake:0,baseStats:base,created:Date.now()}}
function grantCard(key){let inst=cardInstance(key);state.inventory.push(inst);state.dex[key]=true;return inst}
function rarityRoll(){let n=Math.random()*100;return n<5?'SSR':n<20?'SR':n<50?'R':'N'}
function randomKey(){let r=rarityRoll();let cid=Math.floor(Math.random()*40);let v=Math.floor(Math.random()*outfits[r].length);return `${cid}|${r}|${v}`}
function rarityColor(r){return ({SSR:'SSR',SR:'SR',R:'R',N:'N'})[r]}
function art(def,small=false){let c=def.char;return `<div class="card-art" style="background:linear-gradient(145deg,${c.colors[0]},${c.colors[1]})"><span class="rarity ${def.rarity}">${def.rarity}</span><div class="face">${c.emoji}</div><div class="costume">${def.rarity==='SSR'?'👙':def.rarity==='SR'?'🎤':def.rarity==='R'?(def.variant===0?'🌻':'🧣'):(def.variant===0?'🎒':'👟')}</div><div style="font-size:10px;font-weight:900;color:#fff;text-shadow:0 1px 4px #6b4d85">${c.hair}</div></div>`}
function cardTile(inst,actions=true){let d=defOf(inst),s=statsOf(inst);return `<article class="card"><div style="position:relative">${art(d)}<span style="position:absolute;right:7px;top:8px;background:#fffdf0e8;color:#a35a9a;border-radius:8px;padding:4px 6px;font-size:10px;font-weight:900">覚醒 ${inst.awake}/5</span></div><div class="card-info"><strong>${d.char.name}</strong><small>${d.outfit} · Lv.${inst.level}/${maxLevel(inst)}</small><div class="bar" style="margin-top:7px"><span style="width:${inst.xp/xpNeed(inst.level)*100}%"></span></div><small>EXP ${inst.xp}/${inst.level>=maxLevel(inst)?'MAX':xpNeed(inst.level)}</small><div class="mini-stats"><span>顔 ${shown(s.looks)}</span><span>体 ${shown(s.style)}</span><span>踊 ${shown(s.dance)}</span><span>歌 ${shown(s.vocal)}</span></div></div>${actions?`<div class="card-actions"><button class="soft" onclick="openCard(${inst.uid})">詳細</button><button class="purple" onclick="quickTrain(${inst.uid})">レッスン</button></div>`:''}</article>`}
function showToast(msg){let el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),2300)}
function setPage(p){state.activePage=p;document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));render();save()}
document.getElementById('nav').addEventListener('click',e=>{let b=e.target.closest('button[data-page]');if(b)setPage(b.dataset.page)});
function render(){updateHeader();let main=document.getElementById('main');let p=state.activePage;const pages={home:homePage,gacha:gachaPage,cards:cardsPage,training:trainingPage,awakening:awakeningPage,formation:formationPage,encyclopedia:dexPage,settings:settingsPage};main.innerHTML=(pages[p]||homePage)();}
function homePage(){let best=state.inventory.slice().sort((a,b)=>totalStats(b)-totalStats(a))[0];let unique=Object.keys(state.dex).length;return `<section class="hero"><div><div class="eyebrow">YOUR DREAM STARTS HERE ✦</div><h1>きらめけ、<br>わたしのアイドル！</h1><p>お気に入りのアイドルを育てて、最高のステージへ。今日もキラキラを集めよう♡</p><div class="hero-actions"><button class="btn primary" onclick="setPage('gacha')">🎟 ガチャを引く</button><button class="btn purple" onclick="setPage('training')">✨ レッスンする</button></div></div><div class="hero-idol"><div class="idol-art"><div class="face">🎀</div><div class="costume">👗</div><div class="name-tag">桃瀬 ひまり · CENTER</div></div></div></section><div class="stats"><div class="stat"><small>所持カード</small><strong>${state.inventory.length}</strong></div><div class="stat"><small>カード図鑑</small><strong>${unique}<small style="display:inline"> / 240</small></strong></div><div class="stat"><small>覚醒済み</small><strong>${state.inventory.filter(x=>x.awake>0).length}</strong></div><div class="stat"><small>最高レベル</small><strong>${state.inventory.length?Math.max(...state.inventory.map(x=>x.level)):0}</strong></div></div><section class="panel" style="margin-top:16px"><div class="section-title"><h2>💗 お気に入りの育成</h2><small>あなたのアイドルたち</small></div>${best?`<div class="cards">${state.inventory.slice().sort((a,b)=>totalStats(b)-totalStats(a)).slice(0,4).map(x=>cardTile(x)).join('')}</div>`:`<div class="empty">まだカードがありません。ガチャで最初のアイドルをお迎えしよう！</div>`}</section><section class="panel"><div class="section-title"><h2>🌟 今日のミッション</h2><small>自分のペースでOK</small></div><div class="cards"><div class="stat"><small>コレクション</small><strong>${Math.floor(unique/240*100)}%</strong><div class="bar"><span style="width:${unique/240*100}%"></span></div></div><div class="stat"><small>無料ガチャ</small><strong>${state.tickets}枚</strong><small>チケットを使ってお迎え！</small></div><div class="stat"><small>スタミナ</small><strong>${state.stamina}/100</strong><small>3分ごとに1回復</small></div></div></section>`}
function gachaPage(){return `<section class="panel"><div class="section-title"><h2>🎟 きらめきガチャ</h2><small>1時間ごとにチケット1枚 · 最大30枚</small></div><div class="gacha-stage" id="gachaStage"><div class="ticket shine">🎟️</div><h2>あなたの運命の出会いは？</h2><p>チケット ${state.tickets}/30 · 1回1枚 / 10連10枚</p></div><div class="stats"><div class="stat"><small>SSR</small><strong>5%</strong></div><div class="stat"><small>SR</small><strong>15%</strong></div><div class="stat"><small>R</small><strong>30%</strong></div><div class="stat"><small>N</small><strong>50%</strong></div></div><div class="hero-actions" style="justify-content:center"><button class="btn primary" ${state.tickets<1?'disabled':''} onclick="pullGacha(1)">💖 1回ガチャ</button><button class="btn gold" ${state.tickets<10?'disabled':''} onclick="pullGacha(10)">🌈 10連ガチャ</button></div><p style="text-align:center;color:var(--muted);font-size:12px">各回独立抽選。10連確定枠なし。</p><div id="gachaResults"></div></section>`}
function cardsPage(){let filter=window.cardFilter||'ALL';let sort=window.cardSort||'rarity';let list=state.inventory.slice();if(filter!=='ALL')list=list.filter(x=>x.rarity===filter);if(sort==='rarity')list.sort((a,b)=>['SSR','SR','R','N'].indexOf(a.rarity)-['SSR','SR','R','N'].indexOf(b.rarity));if(sort==='level')list.sort((a,b)=>b.level-a.level);if(sort==='awake')list.sort((a,b)=>b.awake-a.awake);return `<section class="panel"><div class="section-title"><h2>💖 所持カード</h2><small>${state.inventory.length}枚</small></div><div class="tabs">${['ALL','SSR','SR','R','N'].map(x=>`<button class="${filter===x?'active':''}" onclick="window.cardFilter='${x}';render()">${x==='ALL'?'すべて':x}</button>`).join('')}</div><div style="display:flex;gap:8px;align-items:center;margin-bottom:14px;flex-wrap:wrap"><label>並び替え <select onchange="window.cardSort=this.value;render()" style="padding:8px;border-radius:10px;border:1px solid #ead7f2"><option value="rarity" ${sort==='rarity'?'selected':''}>レアリティ</option><option value="level" ${sort==='level'?'selected':''}>レベル</option><option value="awake" ${sort==='awake'?'selected':''}>覚醒回数</option></select></label><input id="cardSearch" placeholder="名前で検索" oninput="filterCardSearch()" style="padding:9px 12px;border:1px solid #ead7f2;border-radius:10px"></div><div class="cards" id="ownedCards">${list.map(x=>cardTile(x)).join('')||'<div class="empty">カードがありません。ガチャでお迎えしよう！</div>'}</div></section>`}
function filterCardSearch(){let q=document.getElementById('cardSearch').value.toLowerCase();document.querySelectorAll('#ownedCards .card').forEach(el=>el.style.display=el.textContent.toLowerCase().includes(q)?'':'none')}
function trainingPage(){let list=state.inventory.slice().sort((a,b)=>b.level-a.level);return `<section class="panel"><div class="section-title"><h2>✨ レッスンルーム</h2><small>スタミナ ${state.stamina}/100 · 回復 ${staminaTimer()}</small></div><div class="notice">レッスンで経験値を獲得！レベルアップごとに looks / style / dance / vocal が内部値で各+0.5（表示は整数）。</div><div class="cards"><div class="stat"><small>コース1 · 基礎レッスン</small><strong>EXP +20</strong><p>スタミナ −20</p><button class="btn soft" onclick="trainSelected(20,20)">このコース</button></div><div class="stat"><small>コース2 · 集中レッスン</small><strong>EXP +30</strong><p>スタミナ −30</p><button class="btn purple" onclick="trainSelected(30,30)">このコース</button></div><div class="stat"><small>コース3 · 特訓レッスン</small><strong>EXP +50</strong><p>スタミナ −50</p><button class="btn primary" onclick="trainSelected(50,50)">このコース</button></div></div><div class="section-title" style="margin-top:22px"><h2>育成するカードを選択</h2><small id="selectedTrainingLabel">未選択</small></div><div class="cards">${list.map(x=>`<div onclick="selectTraining(${x.uid})" style="cursor:pointer;outline:${window.selectedTraining===x.uid?'3px solid #ff65b4':'none'};border-radius:20px">${cardTile(x,false)}</div>`).join('')||'<div class="empty">まずはガチャでカードを獲得してください。</div>'}</div></section>`}
function awakeningPage(){let list=state.inventory.filter(x=>x.awake<5&&ownedCount(x.key)>=2);return `<section class="panel"><div class="section-title"><h2>🌟 覚醒ラボ</h2><small>同一カードを合成 · 最大5回</small></div><div class="notice">同じキャラクター・レアリティ・衣装のカードを素材にします。覚醒1回につきレベル上限+2。素材カードは消費されますが、図鑑登録は残ります。</div><div class="cards">${list.map(x=>`<div>${cardTile(x,false)}<div style="padding:0 9px 10px"><button class="btn gold" style="width:100%" onclick="openAwaken(${x.uid})">🌟 覚醒する</button></div></div>`).join('')||'<div class="empty">覚醒できるカードがありません。まったく同じカードを2枚以上集めると覚醒できます。</div>'}</div></section>`}
function formationPage(){let slots=state.formation.map((uid,i)=>{let x=uid?getInst(uid):null;return `<div class="slot ${x?'filled':''}" onclick="chooseFormation(${i})">${x?`${art(defOf(x))}<small>${defOf(x).char.name}</small><small>${x.rarity} · Lv.${x.level}</small>`:`<span style="font-size:35px">＋</span><strong>ポジション ${i+1}</strong><small>${i===0?'CENTER':i<3?'FRONT':'BACK'}</small>`}</div>`}).join('');let lineup=state.formation.map(getInst).filter(Boolean);return `<section class="panel"><div class="section-title"><h2>🎤 フォーメーション</h2><small>最大5人</small></div><div class="notice">ポジションをタップしてカードを配置。センターはlooks、前列はdance、後列はvocalを中心に総合力をチェックできます。</div><div class="form-grid">${slots}</div><div class="stats"><div class="stat"><small>編成人数</small><strong>${lineup.length}/5</strong></div><div class="stat"><small>総合力</small><strong>${Math.floor(lineup.reduce((n,x)=>n+totalStats(x),0))}</strong></div><div class="stat"><small>平均Lv.</small><strong>${lineup.length?Math.floor(lineup.reduce((n,x)=>n+x.level,0)/lineup.length):0}</strong></div><div class="stat"><small>覚醒合計</small><strong>${lineup.reduce((n,x)=>n+x.awake,0)}</strong></div></div><div class="hero-actions"><button class="btn soft" onclick="clearFormation()">編成をクリア</button><button class="btn purple" onclick="autoFormation()">おすすめ編成</button></div></section>`}
function dexPage(){let filter=window.dexFilter||'ALL';let defs=allDefs().filter(d=>filter==='ALL'||d.rarity===filter);let uniq=Object.keys(state.dex).length;return `<section class="panel"><div class="section-title"><h2>📚 アイドル図鑑</h2><small>カード登録 ${uniq}/240 · ${Math.floor(uniq/240*100)}%</small></div><div class="bar" style="height:12px;margin-bottom:16px"><span style="width:${uniq/240*100}%"></span></div><div class="tabs">${['ALL','SSR','SR','R','N'].map(x=>`<button class="${filter===x?'active':''}" onclick="window.dexFilter='${x}';render()">${x==='ALL'?'すべて':x}</button>`).join('')}</div><div class="cards">${defs.map(d=>{let got=!!state.dex[d.key];let owned=ownedCount(d.key);return `<article class="card" style="${got?'':'filter:grayscale(1);opacity:.68'}"><div style="position:relative">${art(d)}<span style="position:absolute;right:7px;top:8px;background:#ffffffdf;padding:4px 6px;border-radius:7px;font-size:10px;font-weight:900">${got?'登録済':'？？？'}</span></div><div class="card-info"><strong>${got?d.char.name:'？？？？'}</strong><small>${got?d.outfit:'未獲得カード'}</small><div class="mini-stats"><span>${d.rarity}</span><span>所持 ${owned}</span></div></div></article>`}).join('')}</div></section>`}
function settingsPage(){return `<section class="panel"><div class="section-title"><h2>💾 セーブ・データ管理</h2><small>自動保存ON</small></div><div class="notice">データはこのブラウザのローカルストレージに保存されます。ブラウザデータの削除や端末変更に備えて、定期的にバックアップを作成してください。</div><div class="stats"><div class="stat"><small>所持カード</small><strong>${state.inventory.length}</strong></div><div class="stat"><small>図鑑登録</small><strong>${Object.keys(state.dex).length}/240</strong></div><div class="stat"><small>チケット</small><strong>${state.tickets}/30</strong></div><div class="stat"><small>スタミナ</small><strong>${state.stamina}/100</strong></div></div><div class="hero-actions"><button class="btn primary" onclick="exportSave()">⬇ バックアップを書き出す</button><button class="btn purple" onclick="document.getElementById('importFile').click()">⬆ バックアップを復元</button><input type="file" id="importFile" accept=".json,application/json" class="hidden" onchange="importSave(event)"><button class="btn soft" onclick="if(confirm('初期化しますか？バックアップがないデータは戻せません。')){localStorage.removeItem('kiramekiSave');state=fresh();save();render();showToast('データを初期化しました')}">データ初期化</button></div><p style="color:var(--muted);font-size:12px">ゲームをGitHub Pagesで公開しても、セーブデータは自動的にGitHubへ送信されません。</p></section>`}
function openModal(content){document.getElementById('modal').innerHTML=content;document.getElementById('modalBackdrop').classList.add('show')}
function closeModal(){document.getElementById('modalBackdrop').classList.remove('show')}
document.getElementById('modalBackdrop').addEventListener('click',e=>{if(e.target.id==='modalBackdrop')closeModal()});
function openCard(uid){let x=getInst(uid);if(!x)return;let d=defOf(x),s=statsOf(x);openModal(`<div class="modal-head"><h2>💖 カード詳細</h2><button class="close" onclick="closeModal()">×</button></div><div style="display:grid;grid-template-columns:minmax(130px,.8fr) 1.2fr;gap:15px;margin-top:12px">${art(d)}<div><h2 style="margin:4px 0">${d.char.name}</h2><p style="color:var(--muted);margin:4px 0">${d.char.hair} · ${d.char.vibe}</p><p><b>${d.outfit}</b> / ${d.rarity}</p><h3>Lv.${x.level} / ${maxLevel(x)}</h3><div class="bar"><span style="width:${x.level>=maxLevel(x)?100:x.xp/xpNeed(x.level)*100}%"></span></div><p>EXP ${x.xp}/${x.level>=maxLevel(x)?'MAX':xpNeed(x.level)}</p><p>覚醒 <b>${x.awake}/5</b>　総合力 <b>${Math.floor(totalStats(x))}</b></p>${Object.entries(s).map(([k,v])=>`<div style="display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid #f0e4f4"><span>${k}</span><b>${shown(v)} / 100</b></div>`).join('')}<div class="hero-actions"><button class="btn purple" onclick="closeModal();window.selectedTraining=${x.uid};setPage('training')">レッスン</button><button class="btn gold" onclick="closeModal();openAwaken(${x.uid})">覚醒</button></div></div></div>`)}
function selectTraining(uid){window.selectedTraining=uid;render();let e=document.getElementById('selectedTrainingLabel');if(e){let x=getInst(uid);e.textContent=x?defOf(x).char.name+' / '+defOf(x).outfit:'未選択'}}
function trainSelected(xp,cost){let uid=window.selectedTraining;let x=uid&&getInst(uid);if(!x){showToast('先に育成するカードを選んでください');return}train(uid,xp,cost)}
function quickTrain(uid){window.selectedTraining=uid;setPage('training')}
function train(uid,xp,cost){syncTimers();let x=getInst(uid);if(!x)return;if(state.stamina<cost){showToast('スタミナが足りません');return}if(x.level>=maxLevel(x)){showToast('このカードはレベルMAXです');return}state.stamina-=cost;state.staminaAnchor=Date.now();let old=x.level;x.xp+=xp;let max=maxLevel(x);while(x.level<max&&x.xp>=xpNeed(x.level)){x.xp-=xpNeed(x.level);x.level++;}if(x.level>=max){x.level=max;x.xp=0;let k=x.uid;if(!state.firstMaxSeen[k]){state.firstMaxSeen[k]=true;save();render();levelMaxEffect(x,old);return}}save();render();showToast(`${defOf(x).char.name} が Lv.${x.level} に！`)}
function levelMaxEffect(x,old){let d=defOf(x);openModal(`<div class="gacha-stage shine"><div class="ticket">👑</div><h2 style="font-size:34px">LEVEL MAX!!</h2><p>おめでとう！ ${d.char.name}</p><p>Lv.${old} → Lv.${x.level} / ${maxLevel(x)}</p><p>✨ 4つの能力が成長しました ✨</p></div><div class="stats">${Object.entries(statsOf(x)).map(([k,v])=>`<div class="stat"><small>${k}</small><strong>${shown(v)}</strong></div>`).join('')}</div><div class="hero-actions" style="justify-content:center"><button class="btn primary" onclick="closeModal()">最高の輝き！</button></div>`)}
function pullGacha(n){syncTimers();if(state.tickets<n){showToast('チケットが足りません');return}state.tickets-=n;state.ticketAnchor=Date.now();save();let stage=document.getElementById('gachaStage');stage.innerHTML=`<div class="ticket shine">✨💎✨</div><h2>きらめき召喚中…</h2><p>光の向こうからアイドルがやってくる！</p>`;stage.classList.add('shine');setTimeout(()=>{let got=[];for(let i=0;i<n;i++)got.push(grantCard(randomKey()));save();render();let target=document.getElementById('gachaResults');if(target){target.innerHTML=`<section class="panel" style="margin-top:15px"><div class="section-title"><h2>🎉 お迎え結果！</h2><small>${n}枚のカードを獲得</small></div><div class="result-grid">${got.map((x,i)=>`<div class="result" style="animation-delay:${i*.07}s">${cardTile(x,false)}</div>`).join('')}</div><div class="hero-actions" style="justify-content:center"><button class="btn primary" onclick="setPage('cards')">所持カードを見る</button><button class="btn soft" onclick="setPage('gacha')">もう一度</button></div></section>`;target.scrollIntoView({behavior:'smooth',block:'start'})}if(got.some(x=>x.rarity==='SSR')){let ssr=got.find(x=>x.rarity==='SSR');openGachaReveal(ssr,n)}},850)}
function openGachaReveal(x,n){let d=defOf(x);openModal(`<div class="gacha-stage shine" style="background:radial-gradient(circle,#fff9e5,#ffcc75 40%,#ed7cce 72%,#8471e8)"><div style="font-size:25px;z-index:1">✦ ✧ SPECIAL ARRIVAL ✧ ✦</div><div class="ticket" style="font-size:100px">🌈</div><h2 style="font-size:34px">SSR GET!!</h2><p>最高の出会いがやってきた！</p></div><div style="display:flex;gap:14px;align-items:center;margin-top:14px">${art(d)}<div><h2>${d.char.name}</h2><p>${d.outfit}</p><p>✨ ${d.char.vibe} ✨</p><button class="btn primary" onclick="closeModal()">お迎えする♡</button></div></div>`)}
function openAwaken(uid){let x=getInst(uid);if(!x)return;if(x.awake>=5){showToast('覚醒は最大5回です');return}let candidates=state.inventory.filter(y=>y.uid!==x.uid&&y.key===x.key);if(!candidates.length){showToast('同じカードの素材が必要です');return}openModal(`<div class="modal-head"><h2>🌟 覚醒する</h2><button class="close" onclick="closeModal()">×</button></div><p>${defOf(x).char.name} · ${defOf(x).outfit} · 覚醒 ${x.awake}/5 → ${x.awake+1}/5</p><div style="display:grid;grid-template-columns:1fr 1fr;gap:12px"><div>${art(defOf(x))}<div class="card-info"><strong>ベースカード</strong><small>Lv.${x.level}/${maxLevel(x)}</small></div></div><div><div class="card-art" style="background:linear-gradient(145deg,#fff0a8,#ffc5ed)"><div class="face">💫</div><div class="costume">✨</div></div><div class="card-info"><strong>合成素材</strong><small>同一カードを1枚消費</small></div></div></div><div class="notice">覚醒後：レベル上限 ${maxLevel(x)} → ${maxLevel(x)+2}</div><label style="display:flex;gap:8px;align-items:center;margin:12px 0"><input type="checkbox" id="awakenConfirm"> 素材カード1枚を消費して覚醒する</label><div class="hero-actions"><button class="btn soft" onclick="closeModal()">キャンセル</button><button class="btn gold" onclick="confirmAwaken(${uid})">🌟 覚醒する！</button></div>`)}
function confirmAwaken(uid){let x=getInst(uid);let check=document.getElementById('awakenConfirm');if(!check||!check.checked){showToast('確認にチェックしてください');return}if(!x||x.awake>=5){closeModal();return}let mat=state.inventory.find(y=>y.uid!==uid&&y.key===x.key);if(!mat){closeModal();showToast('素材カードがありません');return}state.inventory=state.inventory.filter(y=>y.uid!==mat.uid);x.awake++;save();closeModal();render();openModal(`<div class="gacha-stage shine" style="background:radial-gradient(circle,#fff,#ffd6f0 40%,#bca2ff)"><div class="ticket">🌟💖🌟</div><h2 style="font-size:32px;color:#f04ea5">覚醒成功！</h2><p>${defOf(x).char.name} がさらに輝く！</p><p>覚醒 ${x.awake-1}/5 → ${x.awake}/5</p><p>レベル上限 ${maxLevel(x)-2} → ${maxLevel(x)}</p></div><div class="hero-actions" style="justify-content:center"><button class="btn primary" onclick="closeModal()">最高にかわいい！</button></div>`)}
function chooseFormation(slot){if(!state.inventory.length){showToast('先にガチャでカードを獲得してください');return}let opts=state.inventory.map(x=>`<button class="card" style="text-align:left" onclick="setFormation(${slot},${x.uid})">${art(defOf(x))}<div class="card-info"><strong>${defOf(x).char.name}</strong><small>${x.rarity} · Lv.${x.level} · 覚醒${x.awake}/5</small></div></button>`).join('');openModal(`<div class="modal-head"><h2>ポジション ${slot+1} を選択</h2><button class="close" onclick="closeModal()">×</button></div><div class="cards" style="margin-top:12px">${opts}</div>`)}
function setFormation(slot,uid){state.formation[slot]=uid;save();closeModal();render()}
function clearFormation(){state.formation=Array(5).fill(null);save();render();showToast('編成をクリアしました')}
function autoFormation(){let best=state.inventory.slice().sort((a,b)=>totalStats(b)-totalStats(a)).slice(0,5);state.formation=Array.from({length:5},(_,i)=>best[i]?best[i].uid:null);save();render();showToast('総合力の高い5人を編成しました')}
function exportSave(){syncTimers();let blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='kirameki-idol-save.json';a.click();URL.revokeObjectURL(a.href);showToast('バックアップを作成しました')}
function importSave(e){let f=e.target.files[0];if(!f)return;let reader=new FileReader();reader.onload=()=>{try{let s=JSON.parse(reader.result);if(s.version!==1||!Array.isArray(s.inventory))throw new Error();state={...fresh(),...s};save();render();showToast('バックアップを復元しました')}catch(err){showToast('バックアップファイルを読み込めませんでした')}};reader.readAsText(f);e.target.value=''}
function seedDemo(){if(state.inventory.length)return;let x=grantCard('0|SSR|0');x.level=1;grantCard('0|SSR|0');grantCard('1|SR|0');grantCard('2|R|0');save()}
function init(){if(!state.inventory.length){/* New save begins empty, by design. */}render();setInterval(()=>{updateHeader();},1000);setInterval(()=>{let before=state.stamina;syncTimers();if(state.stamina!==before&&state.activePage==='training')render();},10000)}
init();
</script>
</body>
</html>
